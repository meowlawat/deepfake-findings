name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile $(git ls-files '*.py')
      - name: Run tests
        run: pytest -q
      - name: Validate config.yaml
        run: |
          python -c "import yaml; yaml.safe_load(open('config.yaml')); yaml.safe_load(open('e4e5_config.yaml'))"
      - name: Manuscript numeric consistency check
        run: python scripts/audit_manuscript.py
