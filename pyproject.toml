[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-interference"
version = "0.1.0"
description = "Watermark-detector interference study: pipeline, controls, and analysis behind 'Spectral Confounding in Watermark-Detector Interference'"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
